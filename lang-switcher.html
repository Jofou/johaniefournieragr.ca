<script>
(function () {
  var enToFr = {
    '/index.html':   '/fr/index.html',
    '/about.html':   '/fr/a_propos.html',
    '/blog.html':    '/fr/posts.html',
    '/':             '/fr/'
  };
  var frToEn = {
    '/fr/index.html':    '/index.html',
    '/fr/a_propos.html': '/about.html',
    '/fr/posts.html':    '/blog.html',
    '/fr/':              '/'
  };

  function toEn(path) {
    return frToEn[path] || (path.startsWith('/fr/') ? path.slice(3) : path);
  }

  function toFr(path) {
    return enToFr[path] || (path.startsWith('/fr/') ? path : '/fr' + path);
  }

  document.addEventListener('DOMContentLoaded', function () {
    var path = window.location.pathname;
    if (path === '/' || path === '') path = '/index.html';
    if (path === '/fr' || path === '/fr/') path = '/fr/index.html';
    if (path.endsWith('/') && path.length > 1) path = path.slice(0, -1) + '.html';

    // Globe dropdown : pointe vers la page équivalente
    document.querySelectorAll('.dropdown-menu a').forEach(function (a) {
      var label = a.textContent.trim();
      if (label === 'English')  a.setAttribute('href', toEn(path));
      if (label === 'Français') a.setAttribute('href', toFr(path));
    });

    // Si on est en FR : réécrire navbar + traduire labels + intercepter brand
    if (path.startsWith('/fr/')) {

      // Réécrire les liens de la navbar vers leurs équivalents FR
      document.querySelectorAll('.navbar-nav a.nav-link').forEach(function (a) {
        var abs = new URL(a.href).pathname;
        var frPath = toFr(abs);
        if (frPath !== abs) a.setAttribute('href', frPath);
      });

      // Traduire les labels de la navbar
      document.querySelectorAll('.navbar-nav .menu-text').forEach(function (span) {
        var text = span.textContent.trim();
        if (text === 'Home')  span.textContent = 'Accueil';
        if (text === 'About') span.textContent = 'À propos';
        if (text === 'Blog')  span.textContent = 'Blogue';
      });

      // Intercepter le clic sur le nom/brand pour rester en FR
      var brand = document.querySelector('a.navbar-brand');
      if (brand) {
        brand.addEventListener('click', function (e) {
          e.preventDefault();
          window.location.href = '/fr/index.html';
        });
   }
    }
  });
})();
</script>
