<script>
(function () {
  var enToFr = {
    '/about':      '/fr/a_propos',
    '/about.html': '/fr/a_propos.html',
    '/blog':       '/fr/posts',
    '/blog.html':  '/fr/posts.html'
  };
  var frToEn = {
    '/fr/a_propos':      '/about',
    '/fr/a_propos.html': '/about.html',
    '/fr/posts':         '/blog',
    '/fr/posts.html':    '/blog.html'
  };

  function toEn(path) {
    if (frToEn[path]) return frToEn[path];
    if (path.startsWith('/fr/')) return path.slice(3);
    return path;
  }

  function toFr(path) {
    if (enToFr[path]) return enToFr[path];
    if (path.startsWith('/fr/')) return path;
    return '/fr' + path;
  }

  document.addEventListener('DOMContentLoaded', function () {
    var path = window.location.pathname;
    if (path === '/' || path === '')       path = '/index.html';
    if (path === '/fr' || path === '/fr/') path = '/fr/index.html';
    if (path.endsWith('/') && path.length > 1) path = path.slice(0, -1);

    // Globe-icon dropdown: rewrite EN/FR links to match current page
    document.querySelectorAll('.dropdown-menu a').forEach(function (a) {
      var label = a.textContent.trim();
      if (label === 'English')  a.setAttribute('href', toEn(path));
      if (label === 'Français') a.setAttribute('href', toFr(path));
    });

    // Navbar links: keep user in FR when already browsing FR pages
    if (path.startsWith('/fr/')) {
      document.querySelectorAll('.navbar-nav a.nav-link').forEach(function (a) {
        var raw = a.getAttribute('href');
        if (!raw || raw.startsWith('#') || raw.startsWith('http') || raw.startsWith('mailto')) return;
        var absPath = new URL(a.href).pathname;
        var frPath = toFr(absPath);
        if (frPath !== absPath) a.setAttribute('href', frPath);
      });
    }
  });
})();
</script>
